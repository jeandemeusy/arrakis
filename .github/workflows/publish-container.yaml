name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jeandemeusy/bloklune

# There is deliberately no Nix store cache here. Everything these jobs pull is
# stock nixpkgs, already served by cache.nixos.org; the only paths this repo
# builds are the bloklune package and its npm-deps FOD, and both change on
# almost every push. Uploading the closure to the Actions cache cost ~5 min a
# run and saved nothing. What is worth caching is npm's own download cache,
# which `nix develop` does not cover.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Type check and lint
        run: |
          nix develop --command npm ci
          nix develop --command npx tsc --noEmit
          nix develop --command npm run lint

  publish:
    needs: check
    runs-on: ubuntu-latest
    # Pull requests are built by `check` but never published.
    if: github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Build the image
        run: nix build .#container --print-build-logs

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          set -euo pipefail
          # buildLayeredImage writes a tarball; load it, then retag every name the
          # publish is meant to carry.
          docker load < result
          tags="sha-${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="$tags ${{ github.ref_name }}"
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags main"
          fi
          for tag in $tags; do
            docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done
