name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jeandemeusy/bloklune

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v14
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v8

      - name: Type check and lint
        run: |
          nix develop --command npm ci
          nix develop --command npx tsc --noEmit
          nix develop --command npm run lint

  publish:
    needs: check
    runs-on: ubuntu-latest
    # Pull requests are built by `check` but never published.
    if: github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v14
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v8

      - name: Build the image
        run: nix build .#container --print-build-logs

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          set -euo pipefail
          # buildLayeredImage writes a tarball; load it, then retag every name the
          # publish is meant to carry.
          docker load < result
          tags="sha-${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="$tags ${{ github.ref_name }}"
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags main"
          fi
          for tag in $tags; do
            docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done
